
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<meta name="description" content="Download links">
<title>Downloads</title>

<style>
:root {
  --bg:#080808;
  --panel:#121212;
  --panel2:#1a1a1a;
  --text:#f7f7f7;
  --muted:#a6a6a6;
  --red:#ff2638;
  --border:#292929;
  --shadow:rgba(255,25,45,.16);
}
body.light {
  --bg:#f5f5f7;
  --panel:#fff;
  --panel2:#eeeef2;
  --text:#171717;
  --muted:#666;
  --red:#df1027;
  --border:#ddd;
  --shadow:rgba(220,0,30,.10);
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  transition:background .25s,color .25s;
}
a { color:inherit;text-decoration:none; }
button { font:inherit;cursor:pointer; }
.container { width:min(1100px,92%);margin:auto; }

header {
  position:sticky;
  top:0;
  z-index:10;
  background:var(--bg);
  border-bottom:1px solid var(--border);
}
.nav {
  min-height:65px;
  display:flex;
  align-items:center;
  justify-content:flex-end;
}
.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 16px;
  color:var(--text);
  background:var(--panel2);
  font-weight:700;
  transition:transform .2s,box-shadow .2s;
}
.btn:hover {
  transform:translateY(-2px);
  box-shadow:0 0 18px var(--shadow);
}
.btn-red { background:var(--red);color:white;border-color:var(--red); }

.hero {
  padding:55px 0 30px;
  text-align:center;
  background:radial-gradient(ellipse at top,var(--shadow),transparent 65%);
}
.hero h1 {
  font-size:clamp(32px,7vw,55px);
  margin:0 0 12px;
  line-height:1.1;
}
.hero h1 span {
  color:var(--red);
  text-shadow:0 0 25px var(--shadow);
}
.hero p {
  color:var(--muted);
  line-height:1.7;
  margin:0 auto 20px;
}
.section { padding:25px 0 40px; }

.download-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
}
.download-card {
  min-width:0;
  padding:25px 15px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  text-align:center;
  animation:appear .4s ease both;
  transition:transform .25s,border-color .25s,box-shadow .25s;
}
.download-card:hover {
  transform:translateY(-5px);
  border-color:var(--red);
  box-shadow:0 8px 30px var(--shadow);
}
.download-icon {
  font-size:36px;
  margin-bottom:18px;
}
.download-btn { width:100%; }

footer {
  border-top:1px solid var(--border);
  padding:22px 0;
  margin-top:20px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

@keyframes appear {
  from { opacity:0;transform:translateY(12px); }
  to { opacity:1;transform:translateY(0); }
}

@media(max-width:760px) {
  .download-grid {
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }
  .download-card { padding:20px 12px; }
  .hero { padding-top:40px; }
}
@media(max-width:420px) {
  .download-grid { gap:9px; }
  .download-card { padding:17px 9px; }
  .btn { padding:11px 10px;font-size:13px; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>
<header>
  <div class="container nav">
    <button class="btn" id="themeBtn"
      aria-label="Toggle theme">☀️</button>
  </div>
</header>

<main>
<section class="hero">
  <div class="container">
    <h1><span>DOWNLOADS</span></h1>
    <p>Choose a link below to continue.</p>
  </div>
</section>

<section class="container section">
  <div class="download-grid" id="downloadGrid"></div>
</section>
</main>

<footer>
  © <span id="year"></span>
</footer>

<script>
"use strict";

/*
  Only URLs are stored here.
  No app IDs, names, images, descriptions or categories.
*/
const DOWNLOAD_URLS = [
  "https://www.mediafire.com/file/bi29o9o7ecyuapp/MovieBox+premium.apk/file",
  "https://www.mediafire.com/file/1xinohenpqlls25/CAPCUT+ULTRA.apk/file",
  "https://www.mediafire.com/file/1xinohenpqlls25/CAPCUT+ULTRA.apk/file",
  "https://www.mediafire.com/file/m36edj1izvudp3z/PURITY.apk/file",
  "https://www.mediafire.com/file/zv02ccm9jm1k2hi/MX_PLAYER+PRO.apk/file"
];

const THEME_KEY = "downloads-theme-v1";
const downloadGrid = document.getElementById("downloadGrid");

DOWNLOAD_URLS.forEach(url => {
  const card = document.createElement("article");
  card.className = "download-card";

  const icon = document.createElement("div");
  icon.className = "download-icon";
  icon.textContent = "⬇️";

  const link = document.createElement("a");
  link.className = "btn btn-red download-btn";
  link.href = url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = "Download ↗";

  card.append(icon, link);
  downloadGrid.appendChild(card);
});

function setTheme(theme) {
  document.body.classList.toggle("light", theme === "light");
  document.getElementById("themeBtn").textContent =
    theme === "light" ? "🌙" : "☀️";

  try {
    localStorage.setItem(THEME_KEY, theme);
  } catch (e) {}
}

let savedTheme = "dark";

try {
  savedTheme = localStorage.getItem(THEME_KEY) || "dark";
} catch (e) {}

setTheme(savedTheme);

document.getElementById("themeBtn").addEventListener("click", () => {
  setTheme(
    document.body.classList.contains("light") ? "dark" : "light"
  );
});

document.getElementById("year").textContent =
  new Date().getFullYear();
</script>
</body>
</html>
